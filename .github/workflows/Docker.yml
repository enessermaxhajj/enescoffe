name: EnessCoffee CI

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_enessermaxhaj}}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build frontend image
        run: |
          docker build \
            -t enessermaxhaj/enescoffe-frontend:v1.0 \
            ./frontend

      - name: Build backend image
        run: |
          docker build \
            -t enessermaxhaj/enescoffe-backend:v1.0 \
            ./backend

      - name: Push frontend image
        run: |
          docker push \
            enessermaxhaj/enescoffe-frontend:v1.0

      - name: Push backend image
        run: |
          docker push \
            enessermaxhaj/enescoffe-backend:v1.0