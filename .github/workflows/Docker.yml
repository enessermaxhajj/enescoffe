name: EnessCoffee CI

on:
  push:
    branches:
      - main

jobs:
  docker:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build frontend image
        run: |
          docker build \
            -t enessermaxhaj/enescoffe-frontend:${{ github.sha }} \
            ./frontend

      - name: Build backend image
        run: |
          docker build \
            -t enessermaxhaj/enescoffe-backend:${{ github.sha }} \
            ./backend

      - name: Push frontend image
        run: |
          docker push \
            enessermaxhaj/enescoffe-frontend:${{ github.sha }}

      - name: Push backend image
        run: |
          docker push \
            enessermaxhaj/enescoffe-backend:${{ github.sha }}