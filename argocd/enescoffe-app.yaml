apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: enescoffe
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/enessermaxhajj/enescoffe.git
    targetRevision: main
    path: enescoffe

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
