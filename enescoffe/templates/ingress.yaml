apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: enescoffe-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: default-backend-strip-api@kubernetescrd

spec:
  ingressClassName: traefik

  rules:
    - host: enescoffe.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3000
